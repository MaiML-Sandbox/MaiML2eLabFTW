[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "maiml2elabftw"
version = "0.1.0.dev0"
description = "Convert MaiML protocol files into eLabFTW experiment templates."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MaiML-Sandbox" }]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.18", "httpx>=0.27"]

[project.scripts]
maiml2elabftw = "maiml2elabftw.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maiml2elabftw"]
